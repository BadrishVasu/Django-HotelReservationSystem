<!DOCTYPE html>
<html lang="en">
{% load static %}

<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js"> <!--<![endif]-->
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>HOTEL</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
	<link rel="shortcut icon" href="{% static 'favicon.ico' %}">
	<!-- <link href='https://fonts.googleapis.com/css?family=Lato:400,100,100italic,300,300italic,400italic,700italic,900,700,900italic' rel='stylesheet' type='text/css'> -->

	<!-- Stylesheets -->
	<!-- Dropdown Menu -->
	<link rel="stylesheet" href="{% static 'css/superfish.css' %}">
	<!-- Owl Slider -->
	<!-- <link rel="stylesheet" href="css/owl.carousel.css"> -->
	<!-- <link rel="stylesheet" href="css/owl.theme.default.min.css"> -->
	<!-- Date Picker -->
	<link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.min.css' %}">
	<!-- CS Select -->
	<link rel="stylesheet" href='{% static "css/cs-select.css" %}'>
	<link rel="stylesheet" href='{% static "css/cs-skin-border.css" %}'>
	<!-- Themify Icons -->
	<link rel="stylesheet" href='{% static "css/themify-icons.css" %}'>
	<!-- Flat Icon -->
	<link rel="stylesheet" href='{% static "css/flaticon.css" %}'>
	<!-- Icomoon -->
	<link rel="stylesheet" href='{% static "css/icomoon.css" %}'>
	<!-- Flexslider  -->
	<link rel="stylesheet" href='{% static "css/flexslider.css" %}'>
	<link rel="stylesheet" href="{% static 'hotel/css/room_detail_view.css' %}">

	<!-- Style -->
	<link rel="stylesheet" href='{% static "css/style.css" %}'>
	<link rel="stylesheet" href="{% static 'hotel/css/room_detail_view.css' %}">

	<!-- Modernizr JS -->
	<script src='{% static "js/modernizr-2.6.2.min.js" %}'></script>
	<!-- FOR IE9 below -->
	<!--[if lt IE 9]>
	<script src='{% static "js/respond.min.js" %}'></script>
	<![endif]-->
	</head>

	<body>
		<div id="fh5co-wrapper">
		<div id="fh5co-page">
		<div class="fh5co-parallax" style="background-image: url('/static/images/slider1.jpg');" data-stellar-background-ratio="0.5">
			<div class="overlay"></div>
			<div class="container">
				<div class="row">
					<div class="col-md-12 col-md-offset-0 col-sm-12 col-sm-offset-0 col-xs-12 col-xs-offset-0 text-center fh5co-table">
						<div class="fh5co-intro fh5co-table-cell">
							<h1 class="text-center">Your Reservations</h1>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="container">
			<div class="row">
				<div class="col-md-4">

				{% for booking in booking_list %}


						<h2>Room Type: {{booking.get_room_category}} Suite</h2>


						<h2>Room Number: {{booking.room.room_no}}</h2>


						<h3>From: {{booking.check_in}}</h3>


						<h3>To: {{booking.check_out}}</h3>


						<h3>Price: {{booking.room.price}}</h3>

				</div>
				{% endfor %}
			</div>
		</div>
		</div>
		</div>
		</div>

	<!-- Javascripts -->
	<script src='{% static "js/jquery-2.1.4.min.js" %}'></script>
	<!-- Dropdown Menu -->
	<script src='{% static "js/hoverIntent.js" %}'></script>
	<script src='{% static "js/superfish.js" %}'></script>
	<!-- Bootstrap -->
	<script src='{% static "js/bootstrap.min.js" %}'></script>
	<!-- Waypoints -->
	<script src='{% static "js/jquery.waypoints.min.js" %}'></script>
	<!-- Counters -->
	<script src='{% static "js/jquery.countTo.js" %}'></script>
	<!-- Stellar Parallax -->
	<script src='{% static "js/jquery.stellar.min.js" %}'></script>
	<!-- Owl Slider -->
	<!-- // <script src='{% static "js/owl.carousel.min.js" %}'></script> -->
	<!-- Date Picker -->
	<script src='{% static "js/bootstrap-datepicker.min.js" %}'></script>
	<!-- CS Select -->
	<script src='{% static "js/classie.js" %}'></script>
	<script src='{% static "js/selectFx.js" %}'></script>
	<!-- Flexslider -->
	<script src='{% static "js/jquery.flexslider-min.js" %}'></script>

	<script src='{% static "js/custom.js" %}'></script>
	</body>

</html>
